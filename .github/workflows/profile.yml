name: Update profile telemetry

on:
  schedule:
    - cron: '23 12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_profile.py
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: profile-telemetry
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Generate dashboard
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: python3 scripts/update_profile.py
      - name: Save updated dashboard
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/metrics.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: refresh profile telemetry'
          git push origin HEAD:main
